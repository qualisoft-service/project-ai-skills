<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{화면명}} — 앱 시안</title>
<!--
  모바일 앱 시안. 디바이스 프레임 안에서 확인한다.
  - 토큰은 ../tokens.css 한 곳
  - 세이프 에어리어를 침범하지 않는다 (상단 노치 / 하단 홈 인디케이터)
  - 터치 타깃 최소 44×44pt — var(--tap)
  - 실제 카피를 쓴다. Lorem ipsum 금지
-->
<link rel="stylesheet" href="../tokens.css">
<style>
body{background:#e9eaee; display:flex; gap:28px; flex-wrap:wrap;
  justify-content:center; padding:40px 20px 90px}

/* 디바이스 프레임 — 390×844 (iOS 기준). Android는 폭 360도 확인 */
.device{width:390px; flex:none}
.device-label{text-align:center; font-size:12px; color:var(--ink-muted); margin-bottom:8px}
.screen{
  position:relative; width:390px; height:844px; overflow:hidden;
  background:var(--bg); border-radius:44px; border:10px solid #1c1c1e;
  box-shadow:0 18px 50px rgba(0,0,0,.22);
}
/* 세이프 에어리어 — 이 영역 안에 조작 요소를 넣지 않는다 */
.safe-top{height:59px; flex:none}
.safe-bottom{height:34px; flex:none}
.notch{position:absolute; top:10px; left:50%; transform:translateX(-50%);
  width:120px; height:32px; border-radius:20px; background:#1c1c1e; z-index:5}
.home-bar{position:absolute; bottom:9px; left:50%; transform:translateX(-50%);
  width:140px; height:5px; border-radius:3px; background:var(--ink); opacity:.28; z-index:5}

.screen-inner{display:flex; flex-direction:column; height:100%}
.app-body{flex:1; overflow-y:auto; padding:0 20px}

/* 상단 바 — iOS 기준. Android면 뒤로가기 위치와 정렬이 달라진다 */
.app-bar{display:flex; align-items:center; gap:8px; height:44px; flex:none;
  padding:0 4px; border-bottom:1px solid var(--line)}
.app-bar-title{flex:1; text-align:center; font-size:17px; font-weight:600}
.app-bar button{width:var(--tap); height:var(--tap); border:0; background:none;
  color:var(--brand); font-size:16px; cursor:pointer}

/* 하단 탭 — 항목마다 최소 44pt */
.tabbar{display:flex; flex:none; border-top:1px solid var(--line)}
.tabbar a{flex:1; min-height:var(--tap); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px; padding:6px 0;
  font-size:11px; color:var(--ink-muted); text-decoration:none}
.tabbar a.on{color:var(--brand); font-weight:600}
.tab-dot{width:20px; height:20px; border-radius:6px; background:currentColor; opacity:.28}

.app-body h1{font-size:26px; line-height:1.25; margin:20px 0 10px}
.app-body p{font-size:15px; line-height:1.6; color:var(--ink-secondary)}
.app-body .btn{width:100%; margin:16px 0 0}
.app-body .btn + .btn{margin-left:0}
</style>
</head>
<body>

<div class="device">
  <div class="device-label">{{화면명}} · 390×844</div>
  <div class="screen">
    <div class="notch"></div>
    <div class="home-bar"></div>
    <div class="screen-inner">
      <div class="safe-top"></div>

      <div class="app-bar">
        <button aria-label="뒤로">‹</button>
        <span class="app-bar-title">{{화면 제목}}</span>
        <button aria-label="더보기">⋯</button>
      </div>

      <div class="app-body">
        <h1>{{확정 카피 — 화면 정의서에서 그대로}}</h1>
        <p>{{본문}}</p>
        <a class="btn btn-primary" href="#">{{Primary CTA}}</a>
      </div>

      <nav class="tabbar">
        <a class="on" href="#"><span class="tab-dot"></span>{{탭1}}</a>
        <a href="#"><span class="tab-dot"></span>{{탭2}}</a>
        <a href="#"><span class="tab-dot"></span>{{탭3}}</a>
      </nav>

      <div class="safe-bottom"></div>
    </div>
  </div>
</div>

<!-- 화면이 여러 개면 .device 를 복제해 나란히 둔다. 전환 흐름이 눈에 보인다 -->

<div class="mockup-flag">시안 · {{YYYY-MM-DD}}</div>
</body>
</html>
